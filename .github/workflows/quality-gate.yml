name: AI Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Generate golden dataset
        run: python scripts/generate_golden_set.py

      - name: API + safety + agent + SQL data validation tests
        run: pytest -m "api or safety or agent or data" --tb=short

      - name: LLM evaluation gate
        run: python eval/run_eval.py

      - name: Playwright UI smoke
        run: pytest -m ui --tb=short

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: reports/
