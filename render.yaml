services:
  - type: web
    name: ai-quality-lab
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/generate_golden_set.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: EVAL_MODE
        value: heuristic
